name: Workstation smoke test
on:
  push:
    paths: ['app.py','frozen_engine.py','spectral_figures.py','spectral_units.py','demo_examples.py','assets/**','.streamlit/**','requirements.txt','tests/**','.github/workflows/workstation.yml']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py frozen_engine.py spectral_figures.py spectral_units.py demo_examples.py
      - run: python -m pytest -q tests/test_workstation.py tests/test_spectral_figures.py tests/test_spectral_units.py
